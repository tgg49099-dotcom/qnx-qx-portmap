[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qnx-portmap"
version = "0.1.0"
description = "Etat des symboles QNX dans la documentation officielle 8.0, a partir d'un corpus fige (hors ligne)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "QX PORTMAP" }]
keywords = ["qnx", "documentation", "migration", "porting", "offline"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Documentation",
]
dependencies = []

[project.scripts]
qnx-portmap = "qnx_portmap.cli:main"

[project.urls]
Homepage = "https://github.com/"

[tool.setuptools]
packages = ["qnx_portmap"]
include-package-data = false

[tool.setuptools.package-data]
qnx_portmap = []
